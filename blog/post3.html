<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How I helped my friend getting an internship at REVER</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .blog-page {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            margin-top: 120px;
        }
        
        .blog-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2rem;
        }
        
        .blog-title {
            font-size: 2.75rem;
            font-weight: 800;
            color: var(--text-primary);
            margin: 0;
            text-align: left;
            transition: color 0.3s ease;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 50%, var(--accent-primary) 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-shift 3s ease infinite;
        }
        
        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        /* Sticky Back Button */
        .sticky-back-button {
            position: fixed;
            top: 120px;
            left: 20px;
            z-index: 1000;
            animation: slideInLeft 0.5s ease-out;
        }
        
        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .back-link {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            padding: 0.875rem 1.5rem;
            border: 2px solid transparent;
            border-radius: 16px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            backdrop-filter: blur(20px) saturate(180%);
            box-shadow: 
                0 4px 20px rgba(16, 185, 129, 0.3),
                0 0 40px rgba(16, 185, 129, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .back-link:hover {
            background: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary));
            transform: translateX(-5px) scale(1.05);
            box-shadow: 
                0 8px 30px rgba(16, 185, 129, 0.5),
                0 0 60px rgba(16, 185, 129, 0.3);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .back-link:active {
            transform: translateX(-3px) scale(1.02);
        }
        
        .blog-date {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 500;
            font-style: italic;
            margin-bottom: 2rem;
            text-align: left;
            transition: color 0.3s ease;
        }
        
        .picture-gallery {
            position: relative;
            width: 100%;
            max-width: 640px;
            height: 360px;
            border-radius: 20px;
            margin: 0 auto 2rem auto;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.12),
                0 0 0 1px rgba(16, 185, 129, 0.1);
            transition: all 0.3s ease;
        }
        
        .picture-gallery:hover {
            box-shadow: 
                0 16px 48px rgba(16, 185, 129, 0.2),
                0 0 0 1px rgba(16, 185, 129, 0.2);
            transform: translateY(-4px);
        }

        .gallery-track {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .gallery-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            background: var(--bg-secondary);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery-image.active {
            opacity: 1;
        }

        .gallery-controls {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.25);
            padding: 6px 10px;
            border-radius: 999px;
            backdrop-filter: blur(6px);
        }

        .gallery-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.6);
            cursor: pointer;
        }

        .gallery-dot.active {
            background: var(--accent-primary);
        }

        .gallery-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0,0,0,0.25);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
        }

        .gallery-arrow:hover {
            background: rgba(0,0,0,0.35);
        }

        .gallery-arrow.prev { left: 10px; }
        .gallery-arrow.next { right: 10px; }
        
        .blog-content {
            text-align: justify;
            line-height: 1.8;
            color: var(--text-tertiary);
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }
        
        .blog-content p {
            margin-bottom: 1.5rem;
        }
        
        /* Theme Toggle for Blog Posts */
        .blog-theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1001;
        }
        
        .blog-theme-toggle button {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border-color);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 12px;
            color: var(--text-secondary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        .blog-theme-toggle button:hover {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-primary);
            transform: translateY(-2px) scale(1.05);
            border-color: var(--accent-primary);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }
        
        .blog-theme-toggle svg {
            width: 20px;
            height: 20px;
            transition: all 0.3s ease;
        }
        
        @media (max-width: 768px) {
            .blog-page {
                padding: 1rem;
                margin-top: 100px;
            }
            
            .blog-header {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }
            
            .blog-title {
                font-size: 2rem;
            }
            
            .sticky-back-button {
                top: auto;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
            }
            
            .back-link {
                padding: 0.75rem 1.25rem;
                font-size: 0.9rem;
            }
            
            .blog-theme-toggle {
                top: 15px;
                right: 15px;
            }

            .picture-gallery {
                max-width: 100%;
                height: 260px;
            }
        }
    </style>
</head>
<body>
    <!-- Theme Toggle Button -->
    <div class="blog-theme-toggle">
        <button id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
            <svg class="sun-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z"/>
            </svg>
            <svg class="moon-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 003.463-.69.75.75 0 01.981.98 10.503 10.503 0 01-9.694 6.46c-5.799 0-10.5-4.701-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 01.818.162z"/>
            </svg>
        </button>
    </div>

    <!-- Sticky Back Button -->
    <div class="sticky-back-button">
        <a href="../index.html#blog-section" class="back-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back
        </a>
    </div>

    <div class="blog-page">
        <div class="blog-header">
            <h1 class="blog-title">How I helped my friend getting an internship at REVER</h1>
        </div>
        
        <div class="blog-date">4th April, 2025</div>
        
        
        
        <div class="blog-content">
            <p></p>

            <p></p>
            
            <p> </p>
            
            <p></p>
            
            <p></p>
            
            <p></p>
            
            <p></p>

            <p>Aniol Petit</p>
        </div>

        <div class="picture-gallery" id="gallery">
            <div class="gallery-track">
                <!-- Add or remove images below; the script will auto-detect them -->
                <img class="gallery-image active" src="../images/rever1.jpeg" alt="Gallery image 1">
                <img class="gallery-image" src="../images/rever2.jpeg" alt="Gallery image 2">
                <img class="gallery-image" src="../images/rever3.jpeg" alt="Gallery image 3">
            </div>
            <button class="gallery-arrow prev" aria-label="Previous image">&#10094;</button>
            <button class="gallery-arrow next" aria-label="Next image">&#10095;</button>
            <div class="gallery-controls" id="gallery-dots"></div>
        </div>
    </div>

    <script>
        // Theme management for blog posts
        class BlogThemeManager {
            static init() {
                // Check for saved theme preference or default to 'light'
                const savedTheme = localStorage.getItem('theme') || 'light';
                this.setTheme(savedTheme);
                
                // Add event listener to theme toggle button
                const themeToggle = document.getElementById('theme-toggle');
                if (themeToggle) {
                    themeToggle.addEventListener('click', () => {
                        const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
                        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                        this.setTheme(newTheme);
                    });
                }
            }
            
            static setTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
                
                // Update button state
                const themeToggle = document.getElementById('theme-toggle');
                if (themeToggle) {
                    const sunIcon = themeToggle.querySelector('.sun-icon');
                    const moonIcon = themeToggle.querySelector('.moon-icon');
                    
                    if (theme === 'dark') {
                        sunIcon.style.display = 'none';
                        moonIcon.style.display = 'block';
                    } else {
                        sunIcon.style.display = 'block';
                        moonIcon.style.display = 'none';
                    }
                }
            }
        }

        // Initialize theme manager and gallery when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            BlogThemeManager.init();

            const gallery = document.getElementById('gallery');
            if (gallery) {
                const images = Array.from(gallery.querySelectorAll('.gallery-image'));
                const prevBtn = gallery.querySelector('.prev');
                const nextBtn = gallery.querySelector('.next');
                const dotsContainer = document.getElementById('gallery-dots');
                let current = 0;

                // Build dots
                images.forEach((_, idx) => {
                    const dot = document.createElement('span');
                    dot.className = 'gallery-dot' + (idx === 0 ? ' active' : '');
                    dot.addEventListener('click', () => goTo(idx));
                    dotsContainer.appendChild(dot);
                });

                const dots = Array.from(dotsContainer.querySelectorAll('.gallery-dot'));

                function update() {
                    images.forEach((img, i) => img.classList.toggle('active', i === current));
                    dots.forEach((dot, i) => dot.classList.toggle('active', i === current));
                }

                function goTo(index) {
                    current = (index + images.length) % images.length;
                    update();
                }

                prevBtn.addEventListener('click', () => goTo(current - 1));
                nextBtn.addEventListener('click', () => goTo(current + 1));
            }
        });
    </script>
</body>
</html>
